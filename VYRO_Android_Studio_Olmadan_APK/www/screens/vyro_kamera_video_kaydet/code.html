<style>
    /* Custom pulsing keyframes for shutter button and live indicators */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(160, 120, 255, 0.7); }
      70% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 14px rgba(160, 120, 255, 0); }

    }
    .animate-pulse-ring {
      animation: pulse-ring 2.4s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes audio-bounce {
      0%, 100% { height: 4px; }
      50% { height: 14px; }

<!-- Interactive script for camera micro-interactions -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const recordBtn = document.getElementById('record-button');
      if (recordBtn) {
        let isRecording = false;
        recordBtn.addEventListener('click', () => {
          isRecording = !isRecording;
          const innerCore = recordBtn.querySelector('div');
          if (isRecording) {
            innerCore.classList.remove('rounded-full');
            innerCore.classList.add('rounded-lg', 'scale-75');
            recordBtn.classList.add('border-error');
            recordBtn.classList.remove('border-primary-container');
          } else {
            innerCore.classList.add('rounded-full');
            innerCore.classList.remove('rounded-lg', 'scale-75');
            recordBtn.classList.remove('border-error');
            recordBtn.classList.add('border-primary-container');
          }
        });
      }
    });
  </script>
