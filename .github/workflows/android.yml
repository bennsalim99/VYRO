
name: VYRO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35;build-tools;35.0.0'

      - name: Android SDK bileşenlerini kontrol et
        run: |
          sdkmanager --list_installed
          yes | sdkmanager --licenses

      - name: Bağımlılıkları kur
        working-directory: VYRO_Android_Studio_Olmadan_APK
        run: npm install

      - name: Android projesini oluştur
        working-directory: VYRO_Android_Studio_Olmadan_APK
        run: npx cap add android

      - name: Dosyaları eşitle
        working-directory: VYRO_Android_Studio_Olmadan_APK
        run: npx cap sync android

      - name: APK oluştur
        working-directory: VYRO_Android_Studio_Olmadan_APK/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-APK
          path: VYRO_Android_Studio_Olmadan_APK/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
